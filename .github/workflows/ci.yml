name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_only
          POSTGRES_DB: aiemployee
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d aiemployee"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Prepare PostgreSQL tenant role
        env:
          PGPASSWORD: ci_postgres_only
        run: |
          psql -h localhost -U postgres -d aiemployee -c "CREATE ROLE aios LOGIN PASSWORD 'aios_ci_only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS"
          psql -h localhost -U postgres -d aiemployee -c "GRANT CONNECT ON DATABASE aiemployee TO aios; GRANT CREATE ON SCHEMA public TO aios"
      - name: Apply schema
        run: DATABASE_URL=postgres://postgres:ci_postgres_only@localhost:5432/aiemployee npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and RLS integration tests
        env:
          TEST_DATABASE_URL: postgres://aios:aios_ci_only@localhost:5432/aiemployee
          TEST_DATABASE_ADMIN_URL: postgres://postgres:ci_postgres_only@localhost:5432/aiemployee
        run: npm test
      - run: npm run eval
      - name: Build production app
        run: npm run build
      - name: Demo integration
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 60); do curl -fsS http://localhost:14000/api/health && break || sleep 2; done
          npm run demo
          docker compose down -v
      - name: Browser demo E2E
        run: |
          npx playwright install --with-deps chromium
          docker compose up --build -d
          for attempt in $(seq 1 60); do curl -fsS http://localhost:14000/api/health && break || sleep 2; done
          npm run test:e2e
          docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aios-playwright-trace
          path: demo/recordings/
          if-no-files-found: ignore
